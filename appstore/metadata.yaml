# App Store Connect Metadata for GameTracker
# Reference: https://developer.apple.com/help/app-store-connect/create-an-app-record/

# ── App Identity ──────────────────────────────────────────────
app_name: "GameTracker"
subtitle: "Track & Discover Video Games"  # max 30 chars
bundle_id: "com.taco23.gametrackerrrr"

# ── Category ──────────────────────────────────────────────────
primary_category: "Entertainment"
secondary_category: "Utilities"

# ── Description (max 4000 chars) ──────────────────────────────
description: |
  GameTracker helps you organize your video game collection and discover classic titles across 20+ platforms — from NES to PS5.

  YOUR GAMES, BEAUTIFULLY ORGANIZED
  Keep track of what you're playing, what's next, and what you've finished. Games are sorted into clear sections:
  - Short List: Your top priorities (up to 5)
  - To Play: Games you plan to play next
  - Someday, Maybe: Your backlog for later
  - Completed: Games you've finished

  Each section uses a unique color gradient inspired by the Clear app, making your collection as fun to look at as it is to manage.

  DISCOVER HIDDEN GEMS
  Swipe through games Tinder-style to find your next favorite. Browse titles from 20+ platforms including NES, SNES, PlayStation, Xbox, Nintendo Switch, and more. Swipe right to add, left to dismiss — it's that simple.

  SEARCH & ADD
  Search the RAWG database of 800,000+ games. Find any title, pick your platform, and add it to your collection with box art included automatically.

  SHARE YOUR TOP 10
  Generate a shareable graphic of your top games — perfect for social media or comparing lists with friends.

  IMPORT & EXPORT
  Back up your collection as CSV. Import games from spreadsheets with automatic duplicate detection.

  DRAG & DROP
  Reorder your games with intuitive drag-and-drop. Swipe to quickly move games between sections or mark them complete.

  KEY FEATURES
  - Beautiful position-based color gradients for each section
  - Tinder-style game discovery across 20+ platforms
  - Search 800,000+ games via the RAWG database
  - Drag-and-drop reordering
  - Swipe gestures for quick actions
  - CSV import and export
  - Shareable Top 10 graphic
  - Cloud backup support
  - Dark mode UI
  - Bring your own RAWG API key (free at rawg.io)

# ── Promotional Text (max 170 chars, can be updated without review) ──
